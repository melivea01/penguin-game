<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pingüino Valiente</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="app">

  <header class="topbar">
    <button id="langToggle">Español 🇪🇸</button>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="levelText">Nivel 1</span>
    </div>

    <div class="score-box">
      Peces: <span id="score">0</span> 🐟
    </div>
  </header>

  <main class="game-card">

    <div class="penguin-area">
      <img id="penguin" src="https://i.imgur.com/FJGERuP.jpg">
      <p id="penguinMood">Respira. Vamos paso a paso 💗</p>
    </div>

    <h3 id="questionText"></h3>

    <div id="answers"></div>

    <div id="feedback" class="hidden"></div>

    <button id="nextBtn" class="hidden">Siguiente</button>

  </main>

  <div id="levelComplete" class="hidden">
    <h2 id="completeTitle">Nivel completado 🎉</h2>
    <button id="restartBtn">Reiniciar</button>
  </div>

</div>

<script src="./script.js"></script>

</body>
</html>
